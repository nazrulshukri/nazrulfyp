name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nazrul
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: nazrul/package-lock.json
      - name: Install packages
        run: npm ci
      - name: Run tests
        run: npx craco test --watchAll=false
        env:
          CI: true
      - name: Build site
        run: npm run build
        env:
          CI: true
